name: Windows build

# Builds LMN-3.exe, the desktop version you play with the computer keyboard
# and mouse. Download it from the run's "Artifacts" section, or (for lmn3 and
# lmn3-v3-wide) from the branch's "latest" release, which the publish job
# keeps up to date.
on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # CMake 4 refuses the old minimum version in the yaml-cpp submodule
        run: cmake -S . -B build -A x64 -DPACKAGE_TESTS=OFF "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build --config Release --target LMN-3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/LMN-3_artefacts/Release/LMN-3.exe package/
          Copy-Item Windows-README.txt package/README.txt
          Get-ChildItem package

      - uses: actions/upload-artifact@v4
        with:
          name: LMN-3-windows
          path: package/
          retention-days: 30

  # lmn3 and lmn3-v3-wide: put the zip on the branch's "latest" release
  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/lmn3' || github.ref == 'refs/heads/lmn3-v3-wide')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: LMN-3-windows
          path: windows

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd windows && zip -r ../LMN-3-windows.zip .)
          bash .github/publish_latest.sh LMN-3-windows.zip
