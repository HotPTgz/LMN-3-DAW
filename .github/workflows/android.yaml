name: Android build

# Builds LMN-3.apk, the phone version with on-screen controls. Download
# "LMN-3-android" from the run's "Artifacts" section, unzip it and open the
# .apk on the phone, or (for lmn3 and lmn3-v3-wide) get it from the branch's
# "latest" release, which the publish job keeps up to date. A second build (for a PC's processor) is started on an
# Android emulator to check that the app opens; its log is kept as
# "emulator-test".
on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            artifact: LMN-3-android
          - abi: x86_64
            artifact: LMN-3-android-emulator
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's downloads (build tools, libraries), kept between runs so a
      # busy Maven Central doesn't break the build
      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/make_project.py') }}
          restore-keys: gradle-${{ runner.os }}-

      # The JUCE version in this repo can only make Android projects with its
      # Projucer tool, so build that first (cached between runs)
      - name: Cache the Projucer
        id: projucer-cache
        uses: actions/cache@v4
        with:
          path: projucer-build/extras/Projucer/Projucer_artefacts/Release/Projucer
          key: projucer-${{ runner.os }}-${{ hashFiles('tracktion_engine/modules/juce/extras/Projucer/**', 'tracktion_engine/modules/juce/modules/juce_core/system/juce_StandardHeader.h') }}

      - name: Build the Projucer
        if: steps.projucer-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libgtk-3-dev
          # The Projucer doesn't use its web browser (JUCE_WEB_BROWSER=0), and
          # newer Ubuntu no longer has the webkit version it asks for
          sed -i 's/NEEDS_WEB_BROWSER *TRUE/NEEDS_WEB_BROWSER FALSE/' \
            tracktion_engine/modules/juce/extras/Projucer/CMakeLists.txt
          cmake -S tracktion_engine/modules/juce -B projucer-build \
            -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build projucer-build --target Projucer --parallel

      - name: Write the Android Studio project
        env:
          LMN3_ABIS: ${{ matrix.abi }}
        run: |
          # fixes for newer Android versions in the bundled (older) JUCE
          git -C tracktion_engine/modules/juce apply ../../../Android/juce-android-fixes.patch
          python3 Android/make_project.py
          projucer-build/extras/Projucer/Projucer_artefacts/Release/Projucer \
            --resave Android/LMN-3.jucer
          python3 Android/make_project.py --fix-up

      - name: Build the app
        working-directory: Android/Builds/Android
        run: |
          chmod +x gradlew
          # retry once: Maven Central sometimes turns requests away
          ./gradlew --no-daemon assembleRelease_Release || \
            (sleep 60 && ./gradlew --no-daemon assembleRelease_Release)

      - name: List all compile errors
        if: failure()
        working-directory: Android/Builds/Android/app
        run: |
          dir=$(dirname $(find .cxx -name build.ninja | head -1))
          ninja=$(find $ANDROID_HOME/cmake -name ninja -type f | head -1)
          $ninja -C "$dir" -k 0 2>&1 | grep -E "error:" | sort -u | head -150 || true

      - name: Package
        run: |
          mkdir -p package
          find Android/Builds/Android/app/build/outputs -name "*.apk" \
            -exec cp {} package/LMN-3.apk \;
          cp Android/README.txt package/README.txt
          ls -la package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          retention-days: 30

  # lmn3 and lmn3-v3-wide: put the apps on the branch's "latest" release.
  # (It doesn't wait for the emulator test, whose first launch sometimes
  # gets closed by the emulator itself.)
  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/lmn3' || github.ref == 'refs/heads/lmn3-v3-wide')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: LMN-3-android
          path: phone

      - uses: actions/download-artifact@v4
        with:
          name: LMN-3-android-emulator
          path: emulator

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp phone/LMN-3.apk LMN-3-android.apk
          cp emulator/LMN-3.apk LMN-3-android-emulator.apk
          bash .github/publish_latest.sh LMN-3-android.apk LMN-3-android-emulator.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LMN-3-android-emulator
          path: package

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r package/LMN-3.apk
            for i in 1 2 3; do adb shell am force-stop com.fundamentalfrequency.lmn3; adb logcat -c; adb shell am start -W -n com.fundamentalfrequency.lmn3/android.app.Activity; sleep 20; adb shell pidof com.fundamentalfrequency.lmn3 > running$i.txt || echo "not running" > running$i.txt; adb logcat -d > logcat$i.txt; done
            adb shell screencap -p /sdcard/screen.png && adb pull /sdcard/screen.png screen.png || true
            adb shell input tap 2240 760 && sleep 1 && adb shell input tap 2240 760 && sleep 2 || true
            adb shell input swipe 400 940 900 940 600 && sleep 2 || true
            adb shell screencap -p /sdcard/screen2.png && adb pull /sdcard/screen2.png screen2.png || true
            adb shell ls -la /sdcard/Android/data/com.fundamentalfrequency.lmn3/files/ /sdcard/Android/data/com.fundamentalfrequency.lmn3/files/LMN-3/ > shared.txt 2>&1 || true

      - name: Show the crash, if any
        if: always()
        run: |
          failed=0
          for i in 1 2 3; do
            echo "=== attempt $i: app process: $(cat running$i.txt)"
            grep -q "not running" running$i.txt || continue
            failed=1
            echo "== lifecycle and app log:"
            grep -E "LMN3-LIFECYCLE|LMN-3: |quit called|AndroidRuntime|F libc|F DEBUG" logcat$i.txt | cut -c1-200 | head -80 || true
            echo "== system log in the second the window was closed:"
            t=$(grep -m1 "LMN3-LIFECYCLE: onActivityPrePaused" logcat$i.txt | awk '{print $2}' | cut -c1-8)
            [ -n "$t" ] && grep -E "^\S+ $t" logcat$i.txt | grep -vE "SearchServiceCore|AudioStream|AAudio|Oboe|LMN3-LIFECYCLE|PlayerBase" | cut -c1-300 | head -200 || true
          done
          echo "== shared folder:"; cat shared.txt || true
          for f in screen.png screen2.png; do
            [ -f $f ] && echo "== $f base64:" && base64 $f
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: |
            logcat*.txt
            running*.txt
            screen*.png
          retention-days: 7
